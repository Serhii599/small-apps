{% extends "base.html" %}
{% block title %}My tasks table{% endblock %}
{% block content %}
    <div>
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Last name</th>
            </tr>
            </thead>
            <tbody>
            {% for user in users %}
            <tr>
                <th>{{ user.first_name }}</th>
                <th>{{ user.last_name }}</th>
            </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
